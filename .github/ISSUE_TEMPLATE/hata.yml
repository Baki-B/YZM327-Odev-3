name: Hata bildirimi
description: Atölyede, komut satırında ya da bir atomda beklenmeyen bir davranış
labels: [hata]
body:
  - type: textarea
    id: ne
    attributes:
      label: Ne oldu?
      description: Gördüğünüz davranış; varsa hata iletisi ya da ekran görüntüsü.
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: Ne bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Yeniden üretme adımları
      description: Mümkünse atölyeden "Dışa aktar" ile indirilen iş akışı JSON'unu ya da komutu ekleyin (gerçek parola / anahtar eklemeyin).
      placeholder: |
        1. Atölyede "# gizli-bilgi-sızıntısı" paketini açın
        2. ...
    validations:
      required: true
  - type: input
    id: ortam
    attributes:
      label: Ortam
      placeholder: "Chrome 140 / Node 22.23 / Windows 11"
