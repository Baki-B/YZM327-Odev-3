# Kod Bilimi Atölyesi'ni (site, atölye, sunum, rapor) GitHub Pages'e yayınlar:
#   https://baki-b.github.io/YZM327-Odev-3/
# Testler geçmezse yayımlamaz. Derleme adımı yok: depo olduğu gibi sunulur (göreli yollar).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testler (başarısızsa yayımlanmaz)
        run: npm test
      - name: Pages'i etkinleştir (ilk çalıştırmada)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Siteyi hazırla
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./node_modules --exclude=./ornek-agora -cf - . | tar -xf - -C _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
