# CodeQL: GitHub'ın statik güvenlik analizi (herkese açık depolarda ücretsiz). JavaScript kodunda
# XSS, komut enjeksiyonu, güvensiz düzenli ifade gibi açıkları arar; sonuçlar depo
# "Security → Code scanning" sekmesinde görünür.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analiz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
